<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RocksDB LSM 交互教程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* 布局：左侧章节目录 + 右侧正文列；实验台是正文中的独立面板，数据状态用固定的语义色 */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface2: #edf0f4; --ink: #131820; --ink2: #47505e; --muted: #77808f; --line: #dde2e9;
  --accent: #0d6a87; --accent-ink: #ffffff; --accent-soft: #dff0f5;
  --mem: #a86a08; --mem-soft: #fcf1d9; --wal: #6250d6; --wal-soft: #eae7fb;
  --in: #d4551f; --in-soft: #fde5da; --out: #0f8f62; --out-soft: #d9f4e9; --probe: #2a78d6; --probe-soft: #dbe9fb;
  --bad: #d03b3b; --bad-soft: #fbe3e3; --warn: #b77f00; --warn-soft: #fdf0cc; --good: #0b8a0b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #e1e4e9;
  --sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1115; --surface: #161a20; --surface2: #1e242c; --ink: #e7eaef; --ink2: #b1b9c5; --muted: #818a98; --line: #2a313b;
  --accent: #52b6d4; --accent-ink: #05212a; --accent-soft: #12313b;
  --mem: #e0a640; --mem-soft: #33280f; --wal: #9085e9; --wal-soft: #221f3d;
  --in: #f0835a; --in-soft: #3a1f14; --out: #3cc592; --out-soft: #0f3024; --probe: #5b9ff0; --probe-soft: #13283f;
  --bad: #e66767; --bad-soft: #3a1717; --warn: #e0b030; --warn-soft: #332a0c; --good: #3cc03c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2a2f37; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1115; --surface: #161a20; --surface2: #1e242c; --ink: #e7eaef; --ink2: #b1b9c5; --muted: #818a98; --line: #2a313b;
  --accent: #52b6d4; --accent-ink: #05212a; --accent-soft: #12313b;
  --mem: #e0a640; --mem-soft: #33280f; --wal: #9085e9; --wal-soft: #221f3d;
  --in: #f0835a; --in-soft: #3a1f14; --out: #3cc592; --out-soft: #0f3024; --probe: #5b9ff0; --probe-soft: #13283f;
  --bad: #e66767; --bad-soft: #3a1717; --warn: #e0b030; --warn-soft: #332a0c; --good: #3cc03c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2a2f37; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.7; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding: 24px 16px 24px 0; }
nav.toc .brand { font-weight: 600; font-size: 17px; line-height: 1.3; margin-bottom: 4px; }
nav.toc .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
nav.toc a { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: var(--r); color: var(--ink2); text-decoration: none; font-size: 14px; line-height: 1.4; }
nav.toc a:hover { background: var(--surface2); }
nav.toc a.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
nav.toc a .n { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 18px; }
nav.toc a .ok { margin-left: auto; color: var(--good); font-size: 12px; }
main { min-width: 0; padding: 28px 0 80px 28px; border-left: 1px solid var(--line); }
main > article { max-width: 900px; }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 20px; margin: 36px 0 8px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 16px; margin: 20px 0 6px; font-weight: 600; }
p { margin: 8px 0; max-width: 70ch; }
ul, ol { margin: 8px 0; padding-left: 22px; max-width: 70ch; }
li { margin: 3px 0; }
.lead { color: var(--ink2); font-size: 16px; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--surface2); padding: 12px 14px; border-radius: var(--r); overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
pre code { background: none; padding: 0; }
a { color: var(--accent); }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 0 var(--r) var(--r) 0; margin: 12px 0; font-size: 14px; max-width: 76ch; }
.note b:first-child { color: var(--warn); }
.key { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 var(--r) var(--r) 0; margin: 12px 0; font-size: 14px; max-width: 76ch; }
.tablewrap { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
tr.hl td { background: var(--in-soft); }
tr.hl2 td { background: var(--probe-soft); }

/* 实验台 */
.lab { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 16px 0; display: flex; flex-direction: column; gap: 12px; }
.lab > .lab-title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lab > .lab-title .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 0 6px; border-radius: 3px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.bar label { font-size: 13px; color: var(--ink2); display: inline-flex; gap: 5px; align-items: center; }
button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface2); color: var(--ink); cursor: pointer; line-height: 1.4; }
button:hover { border-color: var(--accent); }
button.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, .file:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 84px; font-family: var(--mono); }
select { width: auto; font-family: var(--sans); }
input[type=range] { width: 120px; accent-color: var(--accent); }
.out { font-size: 13.5px; background: var(--surface2); border-radius: var(--r); padding: 8px 12px; min-height: 38px; }
.out:empty { display: none; }
.out b { font-weight: 600; }
.steps { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.steps .st { padding: 3px 8px; border-radius: 4px; color: var(--muted); border-left: 3px solid transparent; }
.steps .st.done { color: var(--ink2); }
.steps .st.cur { color: var(--ink); background: var(--probe-soft); border-left-color: var(--probe); }
.tasks { font-size: 13.5px; display: flex; flex-direction: column; gap: 2px; }
.tasks .t { display: flex; gap: 8px; align-items: baseline; color: var(--ink2); }
.tasks .t::before { content: "○"; color: var(--muted); font-family: var(--mono); }
.tasks .t.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tasks .t.done::before { content: "✓"; color: var(--good); }
.tasks .hd { font-weight: 600; font-size: 13px; color: var(--ink); }

/* LSM 视图 */
.lsm { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.lsm-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; min-width: 120px; background: var(--surface); }
.box .ttl { font-weight: 600; font-size: 12px; display: flex; gap: 6px; justify-content: space-between; }
.box .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.box.mem { border-color: var(--mem); background: var(--mem-soft); flex: 1 1 150px; }
.box.imm { border-color: var(--mem); border-style: dashed; background: var(--surface); flex: 0 1 140px; }
.box.wal { border-color: var(--wal); background: var(--wal-soft); flex: 1 1 150px; }
.box.job { border-color: var(--in); background: var(--in-soft); flex: 1 1 160px; }
.box.hl { box-shadow: 0 0 0 2px var(--probe); }
.meter { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.meter > i { display: block; height: 100%; background: var(--mem); }
.box.job .meter > i { background: var(--in); }
.lvl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 5px; }
.lvl.empty { opacity: .55; }
.lvl-head { font-family: var(--mono); font-size: 11.5px; line-height: 1.35; }
.lvl-head b { font-size: 13px; font-family: var(--sans); }
.lvl-head .chip { display: inline-block; padding: 0 5px; border-radius: 3px; background: var(--surface2); margin-left: 4px; }
.lvl-head .chip.hot { background: var(--in-soft); color: var(--in); font-weight: 600; }
.lvl-head .chip.base { background: var(--accent-soft); color: var(--accent); }
.lvl-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.track { position: relative; height: 20px; background: var(--surface2); border-radius: 3px; }
.lvl.l0 .track { height: 17px; }
.file { position: absolute; top: 1px; bottom: 1px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 3px; font-family: var(--mono); font-size: 10.5px; line-height: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; color: var(--ink); padding: 0; white-space: nowrap; }
.file:hover { filter: brightness(1.08); z-index: 2; }
.file .del { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--bad); }
.file.rd { border-top: 3px double var(--bad); }
.file.busy { border-color: var(--in); background: repeating-linear-gradient(135deg, var(--in-soft) 0 5px, var(--surface) 5px 10px); }
.file.in { border-color: var(--in); background: var(--in-soft); box-shadow: 0 0 0 1px var(--in); }
.file.ov { border-color: var(--probe); background: var(--probe-soft); box-shadow: 0 0 0 1px var(--probe); }
.file.out { border-color: var(--out); background: var(--out-soft); box-shadow: 0 0 0 1px var(--out); }
.file.neg { border-color: var(--muted); background: var(--surface); color: var(--muted); border-style: dashed; }
.file.hit { border-color: var(--out); background: var(--out-soft); box-shadow: 0 0 0 2px var(--out); }
.file.cur { box-shadow: 0 0 0 2px var(--probe); border-color: var(--probe); background: var(--probe-soft); }
.file.sel { box-shadow: 0 0 0 2px var(--ink); }
.file.bad { border-color: var(--bad); background: var(--bad-soft); }
.file.old { border-style: dashed; border-color: var(--muted); background: var(--surface); position: static; padding: 2px 6px; display: inline-flex; }
.keymark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--probe); z-index: 3; pointer-events: none; }
.axis { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; }
.axis > div:last-child { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; border: 1px solid var(--accent); background: var(--accent-soft); vertical-align: -1px; margin-right: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.pill.normal { background: var(--out-soft); color: var(--out); }
.pill.delayed { background: var(--warn-soft); color: var(--warn); }
.pill.stopped { background: var(--bad-soft); color: var(--bad); }
.log { font-size: 12.5px; max-height: 190px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r); padding: 4px 0; }
.log .ev { padding: 2px 10px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; }
.log .ev .ck { font-family: var(--mono); color: var(--muted); font-size: 11px; }
.log .ev .sr { font-family: var(--mono); color: var(--muted); font-size: 11px; }
.log .ev.stall, .log .ev.crash { color: var(--bad); }
.insp { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }
.insp .hd { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.insp .blocks { display: flex; flex-wrap: wrap; gap: 8px; }
.insp .blk { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
.insp .blk .bh { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.ent { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.ent .ty { display: inline-block; min-width: 14px; font-weight: 600; }
.ent.del .ty, .ent.sdel .ty, .ent.rdel .ty { color: var(--bad); }
.ent.merge .ty { color: var(--wal); }
.ent.put .ty { color: var(--out); }
.ent .sq { color: var(--muted); }
.bits { display: flex; flex-wrap: wrap; gap: 1px; max-width: 520px; }
.bits i { width: 6px; height: 9px; background: var(--surface2); }
.bits i.on { background: var(--accent); }
.bits i.pr { outline: 2px solid var(--in); z-index: 1; }

/* 跳表 */
.skip { overflow-x: auto; padding: 4px 0; }
.skip-in { display: inline-flex; gap: 6px; align-items: flex-end; }
.sn { display: flex; flex-direction: column-reverse; gap: 2px; align-items: stretch; min-width: 62px; }
.sn .lv { height: 14px; border: 1px solid var(--mem); background: var(--mem-soft); border-radius: 2px; }
.sn .lv.none { border-color: transparent; background: transparent; }
.sn .lv.path { background: var(--probe); border-color: var(--probe); }
.sn .lb { font-family: var(--mono); font-size: 10.5px; text-align: center; line-height: 1.25; padding-top: 2px; }
.sn.new .lv:not(.none) { background: var(--out); border-color: var(--out); }
.sn.head .lv { background: var(--surface2); border-color: var(--line); }

/* SST 布局条 */
.sstbar { display: flex; height: 34px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.sstbar button { border: 0; border-right: 1px solid var(--surface); border-radius: 0; padding: 0; font-family: var(--mono); font-size: 10.5px; min-width: 14px; overflow: hidden; }
.sstbar .data { background: var(--accent-soft); } .sstbar .filter { background: var(--wal-soft); } .sstbar .index { background: var(--mem-soft); }
.sstbar .footer { background: var(--out-soft); } .sstbar .metaindex, .sstbar .rangedel { background: var(--surface2); }
.sstbar button.on { box-shadow: inset 0 0 0 2px var(--ink); }

/* 测验 */
.quiz { display: flex; flex-direction: column; gap: 14px; }
.quiz .q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.quiz .q .qt { font-weight: 600; margin-bottom: 6px; }
.quiz .q .opts { display: flex; flex-direction: column; gap: 4px; }
.quiz .q .opts button { text-align: left; background: var(--surface); white-space: normal; }
.quiz .q .opts button.right { border-color: var(--good); background: var(--out-soft); }
.quiz .q .opts button.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz .q .why { margin-top: 8px; font-size: 13.5px; color: var(--ink2); }

/* 图表 */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.chart .lg { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; }
.chart .lg i { display: inline-block; width: 12px; height: 3px; vertical-align: 3px; margin-right: 5px; border-radius: 2px; }
.chart .ct { font-size: 13px; font-weight: 600; }
.hbar { display: grid; grid-template-columns: max-content minmax(60px, 1fr) max-content; gap: 4px 10px; align-items: center; font-size: 12.5px; }
.hbar .b { height: 12px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.grid2 > * { min-width: 0; }
.pages { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
.pages i { aspect-ratio: 1; background: var(--surface2); border-radius: 2px; transition: background .6s; }
.pages i.hot { background: var(--in); transition: none; }
.seqlog { display: flex; flex-wrap: wrap; gap: 1px; min-height: 40px; align-content: flex-start; }
.seqlog i { width: 5px; height: 9px; background: var(--wal); border-radius: 1px; }
.pager { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); gap: 8px; }
.optgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 14px; }
.optgrid label { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; font-family: var(--mono); font-size: 11.5px; color: var(--ink2); }
.optgrid label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.optgrid input[type=number] { width: 78px; }
.pass { color: var(--good); font-weight: 600; } .fail { color: var(--bad); font-weight: 600; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.toc { position: static; max-height: none; padding: 14px 0 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  nav.toc .brand { width: 100%; margin: 0; } nav.toc .sub { display: none; }
  nav.toc a { padding: 3px 8px; font-size: 13px; border: 1px solid var(--line); } nav.toc a .n { min-width: 0; }
  main { border-left: 0; padding: 12px 0 60px; }
  .lvl, .axis { grid-template-columns: 92px minmax(0, 1fr); }
  h1 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 第 1 章的小模型 */
.toy { display: flex; flex-direction: column; gap: 6px; }
.toyrow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 6px; }
.toyrow .lb { font-size: 12.5px; line-height: 1.35; } .toyrow .lb span { color: var(--muted); font-size: 11.5px; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; align-items: center; }
.cell { font-family: var(--mono); font-size: 12.5px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface2); }
.cell.dead { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.cell.pr { border-color: var(--probe); background: var(--probe-soft); }
.cell.hit { border-color: var(--out); background: var(--out-soft); box-shadow: 0 0 0 2px var(--out); }
.cells .none { color: var(--muted); font-size: 12.5px; }
@media (max-width: 860px) { .toyrow { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app"><nav class="toc" id="toc" aria-label="章节"></nav><main id="main"></main></div>
<script>
/* LSM 引擎：按 RocksDB (main, 11.x) 的规则实现的缩小版模型。
 * 尺寸单位是"字节"，但数值按比例缩小（默认 write_buffer_size=256 对应真实的 64MB）。
 * 浏览器中挂到 window.LSM，Node 中 module.exports。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LSM = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- 选项 ----------
  // real: RocksDB 真实默认值（仅用于展示）；def: 模拟器中的缩小值
  const OPTION_META = [
    { name: 'write_buffer_size', def: 256, real: '64MB', min: 64, max: 2048, step: 32, group: 'mem', desc: '单个 MemTable 的大小上限。写满后切换为 immutable 并等待 flush。' },
    { name: 'max_write_buffer_number', def: 2, real: '2', min: 1, max: 8, step: 1, group: 'mem', desc: '未 flush 的 immutable MemTable 数量达到该值时，写入停止。' },
    { name: 'level0_file_num_compaction_trigger', def: 4, real: '4', min: 1, max: 16, step: 1, group: 'l0', desc: 'L0 文件数达到该值时触发 L0 compaction（score = 文件数 / 该值）。' },
    { name: 'level0_slowdown_writes_trigger', def: 8, real: '20', min: 1, max: 64, step: 1, group: 'l0', desc: 'L0 文件数达到该值时写入被减速。' },
    { name: 'level0_stop_writes_trigger', def: 12, real: '36', min: 1, max: 96, step: 1, group: 'l0', desc: 'L0 文件数达到该值时写入停止。' },
    { name: 'max_bytes_for_level_base', def: 1024, real: '256MB', min: 128, max: 8192, step: 128, group: 'level', desc: 'base level（静态模式下是 L1）的目标大小。' },
    { name: 'max_bytes_for_level_multiplier', def: 10, real: '10', min: 2, max: 16, step: 1, group: 'level', desc: '相邻两层目标大小的倍数。' },
    { name: 'level_compaction_dynamic_level_bytes', def: true, real: 'true', type: 'bool', group: 'level', desc: '按最底层的实际大小反推各层目标，并动态选择 base level。' },
    { name: 'target_file_size_base', def: 256, real: '64MB', min: 64, max: 2048, step: 32, group: 'level', desc: 'compaction 输出 SST 的目标大小。' },
    { name: 'num_levels', def: 7, real: '7', min: 2, max: 7, step: 1, group: 'level', desc: '层数。' },
    { name: 'compaction_style', def: 'leveled', real: 'kCompactionStyleLevel', type: 'enum', values: ['leveled', 'universal', 'fifo'], group: 'style', desc: 'compaction 策略。' },
    { name: 'compaction_pri', def: 'kMinOverlappingRatio', real: 'kMinOverlappingRatio', type: 'enum', values: ['kMinOverlappingRatio', 'kByCompensatedSize', 'kOldestLargestSeqFirst', 'kOldestSmallestSeqFirst'], group: 'style', desc: 'Leveled 下在一层内挑选文件的优先级。' },
    { name: 'universal_size_ratio', def: 1, real: '1', min: 0, max: 100, step: 1, group: 'style', desc: 'Universal：候选集合大小 ×(100+ratio)/100 ≥ 下一个 sorted run 时把它并入。' },
    { name: 'universal_min_merge_width', def: 2, real: '2', min: 2, max: 8, step: 1, group: 'style', desc: 'Universal：一次 compaction 至少合并的 sorted run 数。' },
    { name: 'universal_max_size_amplification_percent', def: 200, real: '200', min: 10, max: 1000, step: 10, group: 'style', desc: 'Universal：(其余 run 总大小 / 最老 run 大小)×100 达到该值时做全量 compaction。' },
    { name: 'fifo_max_table_files_size', def: 4096, real: '1GB', min: 512, max: 32768, step: 256, group: 'style', desc: 'FIFO：SST 总大小超过该值时删除最老的文件。' },
    { name: 'soft_pending_compaction_bytes_limit', def: 16384, real: '64GB', min: 0, max: 262144, step: 1024, group: 'stall', desc: '估算的待 compaction 字节数达到该值时写入被减速。0 表示关闭。' },
    { name: 'hard_pending_compaction_bytes_limit', def: 65536, real: '256GB', min: 0, max: 1048576, step: 1024, group: 'stall', desc: '估算的待 compaction 字节数达到该值时写入停止。0 表示关闭。' },
    { name: 'max_background_jobs', def: 2, real: '2', min: 1, max: 8, step: 1, group: 'stall', desc: '后台 flush 与 compaction 线程总数。flush 占 1/4（至少 1 个）。' },
    { name: 'disable_auto_compactions', def: false, real: 'false', type: 'bool', group: 'stall', desc: '关闭自动 compaction。' },
    { name: 'bloom_bits_per_key', def: 10, real: '无 filter（常用 10）', min: 0, max: 20, step: 1, group: 'read', desc: 'Bloom filter 每个 key 占的位数。0 表示不建 filter。' },
    { name: 'block_size', def: 64, real: '4KB', min: 32, max: 512, step: 16, group: 'read', desc: 'data block 的目标大小。' },
    { name: 'block_cache_blocks', def: 8, real: '32MB（按字节计）', min: 0, max: 64, step: 1, group: 'read', desc: 'block cache 容量。模拟器按 block 个数计。' },
    { name: 'sync_wal', def: false, real: 'WriteOptions.sync=false', type: 'bool', group: 'mem', desc: '每次写入后对 WAL 执行 fsync。' },
  ];
  // 模拟器自身的设置，不是 RocksDB 选项
  const SIM_META = [
    { name: 'sim_bg_mode', def: 'instant', type: 'enum', values: ['instant', 'timed', 'manual'], desc: '后台任务：instant 立即完成；timed 按速度推进；manual 由你手动触发。' },
    { name: 'sim_flush_bytes_per_tick', def: 128, min: 8, max: 1024, step: 8, desc: 'flush 速度（字节/tick，一次写入占 1 tick）。' },
    { name: 'sim_compaction_bytes_per_tick', def: 48, min: 4, max: 1024, step: 4, desc: '每个 compaction 线程的速度（字节/tick）。' },
    { name: 'sim_delay_ticks', def: 3, min: 1, max: 20, step: 1, desc: '减速状态下每次写入额外等待的 tick 数（真实 RocksDB 用 delayed_write_rate 动态调节）。' },
    { name: 'seed', def: 7, min: 1, max: 9999, step: 1, desc: '随机数种子。' },
  ];
  const DEFAULTS = {};
  OPTION_META.concat(SIM_META).forEach((m) => { DEFAULTS[m.name] = m.def; });

  // ---------- 基础工具 ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const cmpInternal = (a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : b.seq - a.seq);
  const entrySize = (e) => e.k.length + 8 + (e.v ? e.v.length : 0);
  const rdSize = (r) => r.s.length + r.e.length + 8;
  const fmtKey = (n, width) => 'k' + String(n).padStart(width || 3, '0');
  const TYPE_NAME = { put: 'Put', del: 'Delete', sdel: 'SingleDelete', merge: 'Merge', rdel: 'DeleteRange' };

  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  // 与 LevelDB / RocksDB 旧版 block-based filter 相同的双重哈希思路
  function bloomBuild(keys, bitsPerKey) {
    if (!bitsPerKey || !keys.length) return null;
    const m = Math.max(64, keys.length * bitsPerKey);
    const k = Math.max(1, Math.min(30, Math.round(bitsPerKey * 0.69)));
    const bits = new Uint8Array(m);
    for (const key of keys) {
      let h = fnv1a(key); const delta = ((h >>> 17) | (h << 15)) >>> 0;
      for (let i = 0; i < k; i++) { bits[h % m] = 1; h = (h + delta) >>> 0; }
    }
    return { m, k, bits, n: keys.length };
  }
  function bloomProbe(bf, key) {
    let h = fnv1a(key); const delta = ((h >>> 17) | (h << 15)) >>> 0; const pos = [];
    let may = true;
    for (let i = 0; i < bf.k; i++) { const p = h % bf.m; pos.push(p); if (!bf.bits[p]) may = false; h = (h + delta) >>> 0; }
    return { may, pos };
  }

  // ---------- 跳表 MemTable ----------
  const SKIP_MAX_H = 5; // RocksDB 默认 12，分支因子 4
  class SkipList {
    constructor(rng) { this.rng = rng; this.head = { e: null, next: new Array(SKIP_MAX_H).fill(null), h: SKIP_MAX_H }; this.n = 0; }
    _randH() { let h = 1; while (h < SKIP_MAX_H && this.rng() < 0.25) h++; return h; }
    // 返回第一个 >= target 的节点，并记录搜索路径
    _findGE(target, prev, path) {
      let x = this.head;
      for (let lv = SKIP_MAX_H - 1; lv >= 0; lv--) {
        while (x.next[lv] && cmpInternal(x.next[lv].e, target) < 0) { x = x.next[lv]; if (path) path.push({ lv, node: x }); }
        if (prev) prev[lv] = x;
      }
      return x.next[0];
    }
    insert(e) {
      const prev = new Array(SKIP_MAX_H), path = [];
      this._findGE(e, prev, path);
      const h = this._randH(); const node = { e, next: new Array(h).fill(null), h };
      for (let lv = 0; lv < h; lv++) { node.next[lv] = prev[lv].next[lv]; prev[lv].next[lv] = node; }
      this.n++;
      return { node, path, height: h };
    }
    seek(k, seq) { return this._findGE({ k, seq }, null, null); }
    nodes() { const out = []; for (let x = this.head.next[0]; x; x = x.next[0]) out.push(x); return out; }
    toArray() { const out = []; for (let x = this.head.next[0]; x; x = x.next[0]) out.push(x.e); return out; }
  }
  class MemTable {
    constructor(id, logNumber, rng) { this.id = id; this.logNumber = logNumber; this.list = new SkipList(rng); this.rangeDels = []; this.size = 0; this.flushing = false; }
    add(e) { this.size += entrySize(e); return this.list.insert(e); }
    addRangeDel(r) { this.rangeDels.push(r); this.size += rdSize(r); }
    versions(key, snap) {
      const out = [];
      for (let x = this.list.seek(key, snap); x && x.e.k === key; x = x.next[0]) out.push(x.e);
      return out;
    }
    get count() { return this.list.n + this.rangeDels.length; }
    get empty() { return this.count === 0; }
  }

  function maxCoverRd(rds, key, snap) {
    let m = 0;
    for (const r of rds) if (r.seq <= snap && r.seq > m && r.s <= key && key < r.e) m = r.seq;
    return m;
  }

  // ---------- SST ----------
  const fileEndBefore = (f, key) => (f.largestExcl ? f.largest <= key : f.largest < key);
  const fileOverlaps = (f, lo, hi) => !(f.smallest > hi) && !fileEndBefore(f, lo);
  function rangeOf(files) {
    let lo = null, hi = null;
    for (const f of files) { if (lo === null || f.smallest < lo) lo = f.smallest; if (hi === null || f.largest > hi) hi = f.largest; }
    return { lo, hi };
  }
  function findFile(files, key) { // 用于 L1+：二分找到第一个结尾不在 key 之前的文件
    let lo = 0, hi = files.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (fileEndBefore(files[mid], key)) lo = mid + 1; else hi = mid; }
    return lo < files.length && files[lo].smallest <= key ? files[lo] : null;
  }
  function lowerBound(arr, target) {
    let lo = 0, hi = arr.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cmpInternal(arr[mid], target) < 0) lo = mid + 1; else hi = mid; }
    return lo;
  }
  const sumSize = (files) => files.reduce((s, f) => s + f.size, 0);

  // 前缀压缩编码一个 data block（教学展示用）
  function encodeBlock(entries, restartInterval) {
    const rows = []; let prev = ''; let bytes = 0; const restarts = [];
    entries.forEach((e, i) => {
      const restart = i % restartInterval === 0;
      let shared = 0;
      if (!restart) { while (shared < prev.length && shared < e.k.length && prev[shared] === e.k[shared]) shared++; }
      else restarts.push(bytes);
      const nonShared = e.k.length - shared + 8; // +8: 内部 key 尾部的 (seq<<8 | type)
      const vlen = e.v ? e.v.length : 0;
      const sz = 3 + nonShared + vlen; // 3 个 varint 各按 1 字节计
      rows.push({ i, restart, shared, nonShared, vlen, delta: e.k.slice(shared), offset: bytes, size: sz, e });
      bytes += sz; prev = e.k;
    });
    const raw = entries.reduce((s, e) => s + 3 + e.k.length + 8 + (e.v ? e.v.length : 0), 0);
    return { rows, restarts, bytes: bytes + restarts.length * 4 + 4, rawBytes: raw + 4 };
  }

  // ---------- DB ----------
  class DB {
    constructor(opts) {
      this.o = Object.assign({}, DEFAULTS, opts || {});
      this.rng = mulberry32(this.o.seed);
      this.clock = 0; this.seq = 0; this.nextFile = 1; this.nextMemId = 1; this.eventId = 0;
      this.disk = new Map(); this.manifest = []; this.logs = []; this.snapshots = []; this.pins = [];
      this.jobs = []; this.events = []; this.cache = new Map(); this.history = [];
      this.imms = []; this.crashed = false; this.versionId = 0;
      this.stats = this._zeroStats();
      this.version = { id: ++this.versionId, levels: Array.from({ length: this.o.num_levels }, () => []) };
      this._newMem();
      this.manifest.push({ id: 1, kind: 'create', logNumber: this.mem.logNumber, lastSeq: 0, add: [], del: [], note: '创建数据库' });
    }
    _zeroStats() {
      return { userBytes: 0, userOps: 0, walBytes: 0, flushBytes: 0, compReadBytes: 0, compWriteBytes: 0, compWriteByLevel: {}, flushes: 0, compactions: 0, trivialMoves: 0,
        stopTicks: 0, delayTicks: 0, rejected: 0, gets: 0, filesProbed: 0, bloomUseful: 0, bloomFP: 0, blockReads: 0, cacheHits: 0, fifoDropped: 0 };
    }
    log(type, msg, src) {
      this.events.push({ id: ++this.eventId, clock: this.clock, type, msg, src: src || '' });
      if (this.events.length > 400) this.events.splice(0, this.events.length - 400);
    }
    setOption(name, value) { this.o[name] = value; this._schedule(); }

    // ----- WAL / MemTable -----
    _newMem() {
      const logNumber = this.nextFile++;
      this.logs.push({ number: logNumber, records: [] });
      this.mem = new MemTable(this.nextMemId++, logNumber, this.rng);
    }
    _switchMem() {
      if (this.mem.empty) return false;
      const old = this.mem;
      this.imms.push(old);
      this._newMem();
      this.log('switch', `MemTable #${old.id} 已满（${old.size} 字节），转为 immutable；新建 MemTable #${this.mem.id} 和 WAL ${this._fname(this.mem.logNumber, 'log')}`, 'DBImpl::SwitchMemtable');
      return true;
    }
    _fname(n, ext) { return String(n).padStart(6, '0') + '.' + ext; }
    syncWal() { for (const l of this.logs) for (const r of l.records) r.synced = true; this.log('wal', 'WAL 已 fsync', 'DBImpl::SyncWAL'); }

    // ----- 写入 -----
    put(k, v, w) { return this.write([{ t: 'put', k, v: String(v) }], w); }
    delete(k, w) { return this.write([{ t: 'del', k }], w); }
    singleDelete(k, w) { return this.write([{ t: 'sdel', k }], w); }
    merge(k, v, w) { return this.write([{ t: 'merge', k, v: String(v) }], w); }
    deleteRange(s, e, w) { return this.write([{ t: 'rdel', s, e }], w); }
    write(ops, wopts) {
      wopts = wopts || {};
      if (this.crashed) return { ok: false, reason: '数据库已崩溃，请先恢复' };
      const res = { ok: true, switched: false, waited: 0, delayed: 0, paths: [] };
      if (this.mem.size >= this.o.write_buffer_size) { res.switched = this._switchMem(); this._schedule(); }
      for (;;) {
        const st = this.stallCondition();
        if (st.state !== 'stopped') break;
        if (!this._bgCanProgress()) {
          this.stats.rejected++;
          this.log('stall', `写入停止：${st.reason}。没有正在运行的后台任务可以解除该状态。`, 'DBImpl::DelayWrite');
          return { ok: false, stall: st, reason: st.reason };
        }
        if (res.waited === 0) this.log('stall', `写入停止：${st.reason}`, 'DBImpl::DelayWrite');
        this._tick(); res.waited++; this.stats.stopTicks++;
      }
      const st = this.stallCondition();
      if (st.state === 'delayed') {
        for (let i = 0; i < this.o.sim_delay_ticks; i++) { this._tick(); this.stats.delayTicks++; res.delayed++; }
      }
      res.stall = st;
      const first = this.seq + 1; let bytes = 0;
      const rec = { seq: first, ops: ops.map((o) => Object.assign({}, o)), synced: !!(wopts.sync || this.o.sync_wal) };
      this.logs[this.logs.length - 1].records.push(rec);
      if (rec.synced) for (const l of this.logs) for (const r of l.records) r.synced = true;
      for (const op of ops) {
        const seq = ++this.seq;
        if (op.t === 'rdel') { const r = { s: op.s, e: op.e, seq }; this.mem.addRangeDel(r); bytes += rdSize(r); res.paths.push(null); }
        else { const e = { k: op.k, seq, t: op.t, v: op.v }; res.paths.push(this.mem.add(e)); bytes += entrySize(e); }
      }
      rec.size = bytes + 12; // 记录头：checksum/length/type + batch 头，按 12 字节计
      this.stats.walBytes += rec.size; this.stats.userBytes += bytes; this.stats.userOps += ops.length;
      res.seq = first; res.bytes = bytes; res.memId = this.mem.id; res.logNumber = this.mem.logNumber;
      this._tick();
      this._sample();
      return res;
    }

    // ----- write stall -----
    // 对应 ColumnFamilyData::GetWriteStallConditionAndCause
    stallCondition() {
      const o = this.o, v = this.version;
      const numImm = this.imms.length;
      const l0 = this.l0DelayTriggerCount(v);
      const auto = !o.disable_auto_compactions;
      const pending = this.estimatePendingBytes(v);
      const mk = (state, cause, reason) => ({ state, cause, reason, numImm, l0, pending });
      if (numImm >= o.max_write_buffer_number) return mk('stopped', 'memtable', `未 flush 的 immutable MemTable 有 ${numImm} 个 ≥ max_write_buffer_number(${o.max_write_buffer_number})`);
      if (auto && o.compaction_style !== 'fifo' && l0 >= o.level0_stop_writes_trigger) return mk('stopped', 'l0', `L0 文件数 ${l0} ≥ level0_stop_writes_trigger(${o.level0_stop_writes_trigger})`);
      if (auto && o.hard_pending_compaction_bytes_limit > 0 && pending >= o.hard_pending_compaction_bytes_limit) return mk('stopped', 'pending', `待 compaction 字节 ${pending} ≥ hard_pending_compaction_bytes_limit(${o.hard_pending_compaction_bytes_limit})`);
      if (o.max_write_buffer_number > 3 && numImm >= o.max_write_buffer_number - 1) return mk('delayed', 'memtable', `未 flush 的 MemTable 有 ${numImm} 个，接近上限`);
      if (auto && o.compaction_style !== 'fifo' && l0 >= o.level0_slowdown_writes_trigger) return mk('delayed', 'l0', `L0 文件数 ${l0} ≥ level0_slowdown_writes_trigger(${o.level0_slowdown_writes_trigger})`);
      if (auto && o.soft_pending_compaction_bytes_limit > 0 && pending >= o.soft_pending_compaction_bytes_limit) return mk('delayed', 'pending', `待 compaction 字节 ${pending} ≥ soft_pending_compaction_bytes_limit(${o.soft_pending_compaction_bytes_limit})`);
      return mk('normal', '', '');
    }
    l0DelayTriggerCount(v) {
      let n = v.levels[0].length;
      if (this.o.compaction_style === 'universal') for (let i = 1; i < v.levels.length; i++) if (v.levels[i].length) n++;
      return n;
    }
    // 对应 VersionStorageInfo::EstimateCompactionBytesNeeded
    estimatePendingBytes(v) {
      const o = this.o;
      if (o.compaction_style !== 'leveled') return 0;
      const t = this.levelTargets(v);
      let est = 0, toNext = 0, levelSize = sumSize(v.levels[0]), l0Trig = false;
      if (v.levels[0].length >= o.level0_file_num_compaction_trigger || levelSize >= o.max_bytes_for_level_base) { l0Trig = true; est = levelSize; toNext = levelSize; }
      let bytesNext = 0;
      for (let level = t.baseLevel; level <= v.levels.length - 2; level++) {
        if (bytesNext > 0) { levelSize = bytesNext; bytesNext = 0; } else levelSize = sumSize(v.levels[level]);
        if (level === t.baseLevel && l0Trig) est += levelSize;
        levelSize += toNext; toNext = 0;
        const target = t.maxBytes[level];
        if (levelSize > target) {
          toNext = levelSize - target;
          bytesNext = sumSize(v.levels[level + 1]);
          if (bytesNext > 0) est += Math.floor(toNext * (bytesNext / levelSize + 1));
        }
      }
      return est;
    }

    // ----- 层目标大小与 score -----
    // 对应 VersionStorageInfo::CalculateBaseBytes
    levelTargets(v) {
      v = v || this.version; const o = this.o, n = v.levels.length;
      const maxBytes = new Array(n).fill(Infinity); let baseLevel = 1, unnecessary = -1;
      if (o.compaction_style !== 'leveled') return { baseLevel: -1, maxBytes, unnecessary };
      if (!o.level_compaction_dynamic_level_bytes) {
        for (let i = 1; i < n; i++) maxBytes[i] = i === 1 ? o.max_bytes_for_level_base : maxBytes[i - 1] * o.max_bytes_for_level_multiplier;
        maxBytes[0] = o.max_bytes_for_level_base;
        return { baseLevel: 1, maxBytes, unnecessary };
      }
      let maxLevelSize = 0, firstNonEmpty = -1;
      for (let i = 1; i < n; i++) { const s = sumSize(v.levels[i]); if (s > 0 && firstNonEmpty === -1) firstNonEmpty = i; if (s > maxLevelSize) maxLevelSize = s; }
      if (maxLevelSize === 0) return { baseLevel: n - 1, maxBytes, unnecessary };
      const mult = o.max_bytes_for_level_multiplier, baseMax = o.max_bytes_for_level_base, baseMin = Math.floor(baseMax / mult);
      let cur = maxLevelSize;
      for (let i = n - 2; i >= firstNonEmpty; i--) { cur = Math.floor(cur / mult); if (unnecessary === -1 && cur <= baseMin) unnecessary = i; }
      let baseSize;
      if (cur <= baseMin) { baseSize = baseMin + 1; baseLevel = firstNonEmpty; }
      else {
        baseLevel = firstNonEmpty;

    // ----- 读取 -----
    _readBlocks(f, i0, i1) { // 访问 entries[i0..i1] 所在的 block，经过 block cache

  // ---------- 迭代器 ----------

<script>
/* 第 1–5 章 */
(function () {
  'use strict';
  const L = window.LSM, U = window.UI, h = U.h, add = U.add;

  // ================= 2. 写路径 =================
  CH.push({ id: 'write', n: '2', title: '写路径：WAL 与 MemTable', quizN: 4, render(root) {
    prose(root, `
<p class="lead">第 1 章的小模型里，一次写入是"日志追加一行、内存表插入一条"。RocksDB 做的是同一件事，但小模型省略了几个必须回答的问题。这一章先逐个说明这些问题和 RocksDB 的做法，再用实验单步执行一次真实的写入。</p>

<h2>问题一：同一个 key 写了多次，怎么分清新旧</h2>
<p>小模型里，对同一个 key 再写一次，内存表里的旧值直接被换掉。真实系统不能这样做，原因有两个：同一个 key 的不同值会分散在内存表和多个文件里，合并时必须知道谁更新；另外有些读操作需要看到"稍早时刻"的数据（第 5 章），旧值不能立刻消失。</p>
<p>RocksDB 的做法是给<b>每一次写操作一个全局递增的编号</b>，叫 <b>sequence number</b>（下文简称 seq）。编号越大越新。实际存下来的 key 不是你给的 key，而是三部分拼在一起：</p>
<p><code>你给的 key</code> + <code>seq</code> + <code>类型</code></p>
<p>这个拼起来的东西叫<b>内部 key</b>。下文把它写成 <code>k005@12</code>，意思是 key 为 k005、seq 为 12。类型用来区分这是一次写入（Put）还是一次删除（Delete，也就是第 1 章的删除标记，正式名字叫 tombstone）。</p>
<p>排序规则：先按你给的 key 从小到大；key 相同的，seq 大的排前面。这样同一个 key 的各个版本挨在一起，并且最新的排在最前，查找时遇到的第一个就是最新的。</p>
<p>由此得到一个重要的性质：<b>内存表里的记录只增不改</b>。更新一个 key 是插入一条 seq 更大的新记录，删除一个 key 是插入一条类型为 Delete 的记录。</p>

<h2>问题二：为什么先写日志，再写内存表</h2>
<p>日志的作用是断电后重建内存表。所以规则很简单：一条数据必须先进日志，才能进内存表。如果顺序反过来，就可能出现"内存表里有、日志里没有"的数据，断电后它无法恢复。</p>
<p>这里的日志就是 <b>WAL</b>。还有一个细节：程序"写文件"时，数据先到操作系统的缓存里，操作系统稍后才真正写到磁盘。要强制立刻落盘，需要额外调用一次 <code>fsync</code>，它比较慢。RocksDB 默认每次写入<b>不</b>做 fsync，因此：</p>
<ul><li>RocksDB 进程崩溃：数据在操作系统缓存里，不会丢。</li><li>整台机器断电：最近一小段还没落盘的写入会丢。</li></ul>
<p>如果不能接受后一种情况，可以在写入时指定 <code>sync=true</code>，代价是每次写入都慢得多。</p>

<h2>问题三：内存表用什么数据结构</h2>
<p>内存表要保持有序，要能在任意位置快速插入，还要允许一边写一边读。</p>
<ul><li>有序数组：查找快，但在中间插入要挪动后面所有元素。</li><li>平衡树：插入快，但插入时可能要调整树的形状，多个线程同时操作需要加锁。</li></ul>
<p>RocksDB 默认用<b>跳表</b>。它的最底层是一条按顺序连起来的链表。在此之上，一部分节点还有第 2 层、第 3 层……的指针，层数越高的指针一次跨过的节点越多。每个节点有几层是插入时随机决定的：每多一层的概率是 1/4，所以高的节点很少。</p>
<p>查找或插入时，从最高层出发向右走；如果下一个节点已经比目标大，就下降一层继续。这样可以先用高层指针跨过大段节点，再用低层指针走到精确位置。插入只需要改动少数几个指针，不需要整体调整，所以多个线程可以同时插入。</p>
<p>实验里会画出跳表：每一列是一个节点，列的高度是它的层数，蓝色标出一次插入时查找经过的节点。</p>

<h2>问题四：内存表写满时，写入要不要停下来等</h2>
<p>把一个 64MB 的内存表写成文件需要时间。如果写入要等它写完，延迟就会周期性地变得很高。RocksDB 的做法是：</p>
<ol><li>把写满的内存表<b>冻结</b>，变成只读。它的正式名字是 <b>immutable MemTable</b>。</li><li>立刻新建一个空的内存表，后续写入进入新表，不需要等待。</li><li>后台线程把冻结的内存表写成 SST 文件，这个动作叫 <b>flush</b>。写完后冻结的内存表才从内存里释放。</li></ol>
<p>冻结期间它的数据仍然可以被读到：查找时先看当前内存表，再看冻结的内存表。</p>
<p>日志也跟着切换：每个内存表对应一个自己的日志文件，冻结时同时开始写一个新的日志文件。这样做的好处是，等某个冻结的内存表 flush 完成，它对应的那个日志文件就整个没用了，可以直接删除，不需要从一个大日志里挑出哪些行还有用。</p>
<p>如果写入太快、flush 来不及，冻结的内存表会越积越多，占用内存。所以有一个上限 <code>max_write_buffer_number</code>：等待 flush 的内存表达到这个数量时，写入必须停下来等。单个内存表的大小上限是 <code>write_buffer_size</code>。</p>

<h2>实验：单步执行一次写入</h2>
<p>这个实验关闭了后台线程，flush 需要你手动触发，这样可以看清每个状态。MemTable 上限设为 120 字节（约 6 条）。</p>
<p>图的看法：紫色框是当前的 WAL 文件，黄色框是当前的 MemTable，虚线框是冻结的 MemTable。再往下的 L0、L1、L2 是磁盘上的各层，这一章只需要看 L0，flush 出来的文件会出现在那里。</p>`);
    const tasks = U.taskList('按顺序完成：', [
      { text: '写入任意一条数据，用"下一步"看完四个步骤', check: (B) => B.lab.db.seq >= 1 },

    prose(root, `
<h2>补充细节</h2>
<h3>WAL</h3>
<p>WAL 的每条记录是一个 WriteBatch：起始 sequence number、操作个数、每个操作的类型和 key/value。记录按 32KB 的块切分，每个分片带 CRC。WAL 的作用只有一个：进程崩溃后，重放它可以重建还没 flush 的 MemTable（第 5 章）。</p>
<p>是否 fsync 由每次写入的 <code>WriteOptions.sync</code> 决定。不 fsync 时，进程崩溃不丢数据（数据在内核页缓存里），机器掉电会丢最近的写入。</p>
<h3>MemTable</h3>
<p>默认实现是跳表。跳表支持并发插入（<code>allow_concurrent_memtable_write</code>），读不需要加锁。节点一旦插入就不会被修改或删除，更新和删除都是插入新节点。真实的跳表最大高度是 12，这里为了显示缩小为 ${L.SKIP_MAX_H}。</p>
<h3>切换与 flush</h3>
<p>MemTable 达到 <code>write_buffer_size</code> 后，下一次写入会先执行切换：当前 MemTable 变为 immutable，新建一个空的 MemTable 和一个新的 WAL 文件。切换本身很快。immutable MemTable 由后台 flush 线程写成 L0 的 SST 文件；flush 结果写入 MANIFEST 后，对应的旧 WAL 才可以删除。</p>
<p>如果 flush 跟不上，immutable MemTable 会堆积。数量达到 <code>max_write_buffer_number</code> 时写入停止，这是第 9 章 write stall 的三个原因之一。</p>

      { q: '为什么范围扫描的开销随 sorted run 个数增长，而 Bloom filter 帮不上忙？', opts: ['扫描不经过 block cache', '下一个 key 可能在任何一个 sorted run 中，必须对所有 run 做归并；整 key 的 filter 无法回答范围问题', '扫描时 filter 被禁用以节省内存', '扫描只读 L0'], ans: 1, why: 'MergingIterator 必须维护每个 sorted run 的当前位置。只有配置 prefix extractor 并且扫描限定在一个前缀内时，prefix Bloom 才有用。' },
    ]));
  } });

  // ================= 5. 版本与快照 =================
  CH.push({ id: 'version', n: '5', title: '版本、快照与恢复', quizN: 4, render(root) {
    prose(root, `
<p class="lead">每个 SST 文件写完后不再改变，但"数据库现在由哪些文件组成"一直在变：flush 会增加文件，compaction 会用新文件替换旧文件。这一章回答由此产生的四个问题。</p>

<h2>问题一：数据库怎么记住"现在有哪些文件、各在哪一层"</h2>
<p>数据目录里只是一堆 <code>.sst</code> 文件。光看文件名，看不出哪个文件属于哪一层，也分不清哪些是有效的、哪些是合并到一半时留下的。必须有一份记录。</p>
<p>最直接的想法是维护一个"文件列表"文件，每次变化就重写它。但重写到一半断电，列表就坏了。RocksDB 用的还是"只追加"的办法：每次 flush 或 compaction 完成，就在一个日志文件末尾追加一条记录，内容是"在 L1 加入文件 12、13；从 L0 删除文件 7、8、9"这样的变更。</p>
<ul><li>这样的一条变更记录叫 <b>VersionEdit</b>。</li><li>存放这些记录的日志文件叫 <b>MANIFEST</b>。</li></ul>
<p>启动时把 MANIFEST 从头到尾重放一遍，就得到当前的文件列表。一次 compaction 的"加入新文件"和"删除旧文件"写在同一条记录里，所以要么都生效，要么都不生效，不会停在中间状态。</p>

<h2>问题二：读到一半，要读的文件被 compaction 换掉了怎么办</h2>
<p>一次查找或扫描需要一段时间。在这期间 compaction 可能刚好完成，把它正要读的文件替换成了新文件。旧文件此时不能删除，否则这次读就失败了。</p>
<p>RocksDB 的做法是把"某一时刻的文件列表"做成一个<b>不可修改的对象</b>，叫一个 <b>Version</b>。每来一条 VersionEdit，不是去修改当前的 Version，而是生成一个新的 Version。读操作开始时拿住当时的 Version，读完再放开。一个文件只有在不被任何还在使用的 Version 引用时，才会从磁盘上删除。</p>
<p>读操作除了文件，还要看当前的 MemTable 和冻结的 MemTable。RocksDB 把"当前 MemTable、冻结的 MemTable 列表、当前 Version"打包成一个对象，叫 <b>SuperVersion</b>，读操作开始时一次拿住它。</p>

<h2>问题三：想让一连串的读看到同一时刻的数据</h2>
<p>例如备份时要扫描整个数据库，扫描期间写入还在继续。如果扫到前半段时看到的是旧数据、后半段看到的是新数据，备份就不一致。</p>
<p>第 2 章说过每次写入都有一个递增的 seq。所以"某一时刻"可以用一个数字表示：记下当时最新的 seq，之后读的时候忽略所有 seq 比它大的记录。这个被记下来的 seq 就叫一个 <b>snapshot</b>。它不复制任何数据，创建它几乎没有开销。</p>
<p>开销出现在 compaction 上。平时 compaction 对每个 key 只保留最新的版本。有 snapshot 时，snapshot 还需要读到的旧版本不能丢。规则是：</p>
<ul><li>把所有还在使用的 snapshot 的 seq 标在数轴上，它们把数轴切成几段。</li><li>对同一个 key，<b>每一段里只保留最新的一个版本</b>。</li></ul>
<p>举例：某个 key 有 5 个版本，seq 分别是 3、7、12、18、30；有两个 snapshot，seq 是 10 和 20。</p>
<div class="tablewrap"><table><thead><tr><th>段</th><th>落在这一段的版本</th><th>保留</th><th>原因</th></tr></thead><tbody>
<tr><td>seq ≤ 10</td><td>3、7</td><td>7</td><td>snapshot 10 能看到的最新版本是 7；版本 3 没有任何读操作会再看到</td></tr>
<tr><td>11 ≤ seq ≤ 20</td><td>12、18</td><td>18</td><td>snapshot 20 能看到的最新版本是 18</td></tr>
<tr><td>seq &gt; 20</td><td>30</td><td>30</td><td>不带 snapshot 的普通读看到它</td></tr></tbody></table></div>
<p>没有 snapshot 时数轴只有一段，每个 key 只留最新的一个。snapshot 用完必须释放，否则它保护的旧版本会一直被抄进新文件，占用空间。</p>

<h2>问题四：断电之后怎么恢复</h2>
<p>有了 MANIFEST（记录文件列表）和 WAL（记录还没 flush 的数据），恢复就是把这两份日志依次重放。具体步骤在实验之后说明。</p>

<h2>实验</h2>
<p>图的看法与第 2 章相同。右下方两个小表分别显示 MANIFEST 里最近的几条 VersionEdit，以及当前有哪些 snapshot 和迭代器。"Compact L0"会把 L0 的全部文件合并到 L1。</p>`);
    const tasks = U.taskList('场景一：snapshot 如何让旧版本留下来', [
      { text: 'Put k010 = v1', check: (B) => B.lab.db.get('k010').value === 'v1' || B.lab.db.seq > 1 },
      { text: '获取一个 snapshot', check: (B) => B.lab.db.snapshots.length > 0 },
      { text: 'Put k010 = v2（覆盖）', check: (B) => B.lab.db.get('k010').value === 'v2' },
      { text: 'Flush，然后点击生成的 L0 文件，确认里面同时有 k010 的两个版本', check: (B) => B.lab.db.stats.flushes > 0 && B.lab.db.version.levels[0].some((f) => f.entries.filter((e) => e.k === 'k010').length >= 2) },
      { text: '点"用最老的 snapshot 读"，确认读到 v1', check: (B) => B.last && B.last.a.t === 'get' && B.last.a.opt && B.last.r.value === 'v1' },
      { text: '释放 snapshot，再执行"Compact L0"，确认旧版本被丢弃', check: (B) => B.lab.db.snapshots.length === 0 && B.lab.db.stats.compactions > 0 },
    ]);
    const B = U.bench('snapshot、迭代器与 MANIFEST', { opts: { sim_bg_mode: 'manual', write_buffer_size: 200, num_levels: 4, level_compaction_dynamic_level_bytes: false }, view: { keySpace: 100, plain: true }, tasks });
    const kIn = B.input('key', '10', 50), vIn = B.input('value', 'v1', 60); const side = h('div', { class: 'grid2' }); add(B.extra, side);
    B.onRefresh = () => {
      const db = B.lab.db; side.textContent = '';
      add(side, h('div', null, h('div', { style: 'font-size:12.5px;font-weight:600' }, 'MANIFEST（VersionEdit 日志，最近 6 条）'), U.table(['#', '类型', '加入', '删除', 'log_number'], db.manifest.slice(-6).map((e) => [e.id, e.kind, e.add.map((a) => `L${a.level}:#${a.id}`).join(' ') || '—', e.del.map((d) => `L${d.level}:#${d.id}`).join(' ') || '—', e.logNumber]), { num: [0, 4] })));
      add(side, h('div', null, h('div', { style: 'font-size:12.5px;font-weight:600' }, '读视图'), h('div', { style: 'font-size:13px', html: `当前 last_sequence：<b>${db.seq}</b><br>活跃 snapshot（seq）：<b>${db.snapshots.join('、') || '无'}</b><br>打开的迭代器：<b>${(db._iters || []).length}</b> 个` + ((db._iters || []).length ? `，固定了 Version ${db._iters.map((i) => 'v' + i.pin.version.id).join('、')}` : '') + `<br>当前 Version：<b>v${db.version.id}</b>` })));
    };
    const need = () => !B.lab.db.crashed || (B.say('数据库处于崩溃状态，请先点"恢复"。'), false);
    B.btn('Put', () => { if (!need()) return; const k = U.parseKey(kIn.value); if (!k) return; B.act({ t: 'put', k, v: vIn.value || 'v' }, (r) => (r.ok ? `Put ${k} = ${U.esc(vIn.value)}，seq ${r.seq}。` : '<b class="fail">写入被拒绝：</b>' + U.esc(r.reason) + '。请先 Flush。')); }, 'pri');
    B.btn('Get', () => { if (!need()) return; const k = U.parseKey(kIn.value); if (k) B.act({ t: 'get', k }, (r) => `Get(${k}) → <b>${r.found ? U.esc(r.value) : 'NotFound'}</b>（读最新数据）`); });
    B.sep();
    B.btn('获取 snapshot', () => need() && B.act({ t: 'snap' }, (s) => `snapshot 的 seq = ${s}。之后写入的数据对它不可见。`));
    B.btn('用最老的 snapshot 读', () => { if (!need()) return; const db = B.lab.db, k = U.parseKey(kIn.value); if (!db.snapshots.length) return B.say('没有活跃的 snapshot。'); B.act({ t: 'get', k, opt: { snapshot: db.snapshots[0] } }, (r) => `Get(${k}, snapshot=${db.snapshots[0]}) → <b>${r.found ? U.esc(r.value) : 'NotFound'}</b>`); });
    B.btn('释放最老的 snapshot', () => { const db = B.lab.db; if (!db.snapshots.length) return B.say('没有活跃的 snapshot。'); B.act({ t: 'release', seq: db.snapshots[0] }, () => '已释放。下一次涉及这些 key 的 compaction 可以丢弃它保护的旧版本。'); });
    B.sep();
    B.btn('Flush', () => need() && B.act({ t: 'flush' }, (r) => (r ? `flush 生成 ${r.files.map((f) => '#' + f.id).join('、')}。` : '没有可 flush 的数据。')));
    B.btn('Compact L0', () => need() && B.act({ t: 'manual', level: 0 }, (r) => (r ? `compaction 完成：读 ${r.read} B，写 ${r.written} B，丢弃旧版本 ${r.dropped.shadowed} 条。` : 'L0 没有文件。')));
    B.sep();
    B.btn('打开迭代器', () => need() && B.act({ t: 'iterOpen' }, () => '迭代器取得了当前 SuperVersion 的引用。之后被 compaction 淘汰的文件要等它关闭才能删除。'));
    B.btn('关闭迭代器', () => B.act({ t: 'iterClose' }, () => '迭代器已关闭，它固定的旧文件如果不再被引用就会被删除。'));
    B.sep();
    B.btn('fsync WAL', () => need() && B.act({ t: 'sync' }, () => 'WAL 已 fsync。'));
    B.btn('进程崩溃', () => need() && B.act({ t: 'crash', kind: 'process' }, () => '进程崩溃。MemTable 丢失，WAL 完整。点"恢复"。'));
    B.btn('掉电', () => need() && B.act({ t: 'crash', kind: 'machine' }, (r) => `掉电。MemTable 丢失，未 fsync 的 ${r.lost} 条 WAL 记录丢失。点"恢复"。`));
    B.btn('恢复', () => { if (!B.lab.db.crashed) return B.say('数据库没有崩溃。'); B.act({ t: 'recover' }, (steps) => '<b>恢复步骤：</b><ol style="margin:4px 0">' + steps.map((s) => '<li>' + U.esc(s) + '</li>').join('') + '</ol>'); });
    add(root, B.el); B.refresh();
    prose(root, `
<h3>场景二：迭代器固定旧文件</h3>
<p>完成场景一后继续：写几条数据并 Flush 两次，让 L0 有文件；点"打开迭代器"；再点"Compact L0"。compaction 的输入文件已经不在当前 Version 中，但图的下方会出现一行"仍被旧版本引用而不能删除的文件"。关闭迭代器后它们才消失。</p>
<p>这解释了一个常见现象：长时间不关闭的迭代器会让磁盘占用上涨，因为它引用的旧文件无法回收。长时间持有的 snapshot 也有类似效果，不过机制不同：snapshot 不固定文件，而是让 compaction 不得不把旧版本抄进新文件。</p>
<h3>场景三：崩溃恢复</h3>
<p>写几条数据（不要 flush），分别尝试"进程崩溃"和"掉电"后恢复，比较哪些数据还在。掉电前如果点过"fsync WAL"，结果又会不同。</p>
<h2>恢复流程</h2>
<ol>
<li>读 <code>CURRENT</code> 文件，找到当前的 MANIFEST。</li>
<li>重放 MANIFEST 中的全部 VersionEdit，得到每一层的文件列表，以及 <code>log_number</code>：编号小于它的 WAL 已经完整 flush，不需要了。</li>
<li>按编号顺序重放其余的 WAL，把操作重新插入 MemTable。WAL 记录带 CRC；遇到尾部不完整的记录时的处理方式由 <code>wal_recovery_mode</code> 决定，默认是 <code>kPointInTimeRecovery</code>：在第一处损坏的位置停下，保证恢复到某个一致的时间点。</li>
<li>把重放得到的 MemTable flush 成 L0 文件（<code>avoid_flush_during_recovery=false</code> 时），写入新的 VersionEdit。</li>
<li>删除不在任何 Version 中的文件，例如崩溃时写了一半的 compaction 输出。</li>
</ol>
<p>compaction 的原子性由 MANIFEST 保证：输出文件全部写完并 fsync 之后，才用一条 VersionEdit 同时"加入新文件、删除旧文件"。崩溃发生在这之前，旧文件仍然有效；发生在这之后，新文件生效。</p>
<div class="note"><b>简化说明</b> 模拟器的 compaction 输出在完成瞬间才生成，所以恢复时不会出现孤儿文件。真实的 MANIFEST 会在增长到一定大小后重写为一个包含完整快照的新文件。</div>
<h2>源码对照</h2>`);
    add(root, srcTable([['VersionEdit 的编码', 'db/version_edit.cc'], ['应用 edit、写 MANIFEST', 'db/version_set.cc: VersionSet::LogAndApply'], ['SuperVersion', 'db/column_family.h: struct SuperVersion'], ['Snapshot', 'db/snapshot_impl.h, DBImpl::GetSnapshot'], ['恢复', 'db/db_impl/db_impl_open.cc: DBImpl::Recover, RecoverLogFiles'], ['删除过期文件', 'db/db_impl/db_impl_files.cc: FindObsoleteFiles, PurgeObsoleteFiles']]));
    prose(root, '<h2>自测</h2>');
    add(root, U.quiz('version', [
      { q: '获取一个 snapshot 时，RocksDB 做了什么？', opts: ['复制当前所有 SST 文件', '记下当前的 sequence number', '对所有文件加读锁', '把 MemTable flush 到磁盘'], ans: 1, why: 'snapshot 只是一个 seq，放进一个链表。它的开销体现在之后的 compaction 需要为它保留旧版本。' },
      { q: '有 snapshot S1(seq=10) 和 S2(seq=20)。key k 有四个版本：seq 5、8、15、25。一次包含全部四个版本的 compaction 之后，剩下哪些？', opts: ['只有 25', '25、15、8', '25、15、8、5', '25 和 5'], ans: 1, why: 'snapshot 把 seq 轴分成三段：≤10、11–20、>20。每段保留最新的一个：8（S1 看到的）、15（S2 看到的）、25（最新读看到的）。seq 5 被同段内的 8 遮蔽，可以丢弃。' },
      { q: 'compaction 把 3 个输入文件合并成 2 个输出文件。在哪一刻之后，读操作开始使用输出文件？', opts: ['每写完一个输出文件就立即可见', '包含这次变更的 VersionEdit 写入 MANIFEST 并安装为新 Version 之后', '输入文件被删除之后', '下一次 flush 之后'], ans: 1, why: '新 Version 安装是原子的。之前开始的读继续使用旧 Version 及其文件。' },
      { q: '一个迭代器开了 6 小时没有关闭，期间数据库持续写入。最可能观察到什么？', opts: ['写入被阻塞', '磁盘占用高于正常水平，因为它引用的旧 SST 无法删除', '新写入的数据丢失', 'Bloom filter 失效'], ans: 1, why: '迭代器持有 SuperVersion 的引用，其中所有文件在它关闭前都不能删除，即使 compaction 早已生成了替代它们的新文件。' },
    ]));
  } });
})();

</script>
<script>
/* 第 1 章：从一个日志文件开始，一步步搭出 LSM */
(function () {
  'use strict';
  const L = window.LSM, U = window.UI, h = U.h, add = U.add, CH = window.CHAPTERS, prose = window.CHUTIL.prose;

  // 一个很小的独立模型，只用于本章。f 决定这一步已经有哪些部件。
  function toy(title, f, seed) {
    const CAP = 4; const S = { log: [], mem: [], files: [], fid: 0 }; let hl = {}; let rnd = 1;
    const msg = h('div', { class: 'out', 'aria-live': 'polite' }), body = h('div', { class: 'toy' });
    const cell = (e, cls) => h('span', { class: 'cell ' + (cls || '') + (e.v === null ? ' dead' : '') }, e.k + '=' + (e.v === null ? '✕' : e.v));
    const bsearch = (arr, k) => { let lo = 0, hi = arr.length - 1, n = 0; const seen = []; while (lo <= hi) { const mid = (lo + hi) >> 1; n++; seen.push(mid); if (arr[mid].k === k) return { idx: mid, n, seen }; if (arr[mid].k < k) lo = mid + 1; else hi = mid - 1; } return { idx: -1, n, seen }; };
    const draw = () => {
      body.textContent = '';
      const row = (label, note, content) => add(body, h('div', { class: 'toyrow' }, h('div', { class: 'lb' }, h('b', null, label), h('br'), h('span', null, note)), h('div', { class: 'cells' }, content)));
      if (f.log || f.wal) row(f.mem ? '日志文件' : '数据文件', '磁盘 · 只在末尾追加', S.log.length ? S.log.map((e, i) => cell(e, hl.log && hl.log[i])) : h('span', { class: 'none' }, '空'));
      if (f.mem) {
        row('内存里的有序表', `最多 ${CAP} 条 · 按 key 排序`, S.mem.length ? S.mem.map((e, i) => cell(e, hl.mem && hl.mem[i])) : h('span', { class: 'none' }, S.crashed ? '断电后内存被清空' : '空'));
        if (!S.files.length) row('磁盘上的有序文件', '写好后不再修改', h('span', { class: 'none' }, '还没有'));
        S.files.forEach((fl, i) => row('有序文件 ' + fl.id, (i === 0 ? '最新 · ' : i === S.files.length - 1 ? '最老 · ' : '') + '磁盘 · 不再修改', fl.rows.map((e, j) => cell(e, hl['f' + fl.id] && hl['f' + fl.id][j]))));
      }
    };
    const say = (s) => { msg.innerHTML = s; };
    const put = (k, v, quiet) => {
      hl = {}; let note = '', flushed = 0;
      if (S.crashed) return say('机器断电了，先点"重启并恢复"。');
      if (f.log || f.wal) S.log.push({ k, v });
      if (f.mem) {
        const i = S.mem.findIndex((e) => e.k >= k);
        if (i >= 0 && S.mem[i].k === k) S.mem[i] = { k, v }; else if (i < 0) S.mem.push({ k, v }); else S.mem.splice(i, 0, { k, v });
        note = `内存表里按顺序插入 <code>${k}</code>。`;
        if (S.mem.length >= CAP) {
          S.files.unshift({ id: ++S.fid, rows: S.mem }); S.mem = []; flushed = S.fid;
          note += `<b>内存表满了</b>：把这 ${CAP} 条按顺序一次写成"有序文件 ${S.fid}"，然后清空内存表。` + (f.wal ? '这些数据已经安全地在有序文件里，日志里对应的内容不再需要，可以清掉。' : '');
          if (f.wal) S.log = [];
        }
      }
      if (!quiet) say((f.log || f.wal ? `在${f.mem ? '日志' : '数据'}文件末尾追加一行 <code>${k}=${v === null ? '✕' : v}</code>。` : '') + note);
      draw();
      return `<code>${k}=${v === null ? '✕' : v}</code>` + (flushed ? `（这时内存表满了，里面的 ${CAP} 条被写成有序文件 ${flushed}）` : '');
    };
    const get = (k) => {
      hl = {}; if (S.crashed) return say('机器断电了，先点"重启并恢复"。');
      if (!f.mem) {

<h2>问题一：文件很大，怎样不读整个文件就找到一个 key</h2>
<p>文件里的记录是按 key 排好序的，自然会想到二分查找。但二分查找需要"直接跳到第 N 条记录"，而每条记录的 key 和 value 长度都不一样，不读前面的内容就不知道第 N 条从哪个字节开始。</p>
<p>办法是把记录<b>切成一段一段</b>，每段大约 4KB，叫一个 <b>data block</b>。再另外做一张<b>目录</b>，每个 block 在目录里占一行，写着"这个 block 里的 key 到哪里为止、它在文件的哪个位置、多长"。这张目录叫 <b>index block</b>。</p>

    prose(root, `
<p class="lead">第 1 章最后说过：每次都合并所有文件太贵，所以要把文件分层，每次只合并一小部分。这一章讲 RocksDB 默认的分层合并策略，叫 Leveled compaction。核心问题只有一个：现在应该合并哪些文件。你会先预测，再对照实际的选择。</p>
<h2>分层的规则</h2>
<ul>
<li><b>L0</b> 放 flush 直接产生的文件，文件之间 key 范围互相重叠。</li>
<li><b>L1 及以下</b>，同一层里的文件 key 范围互不重叠，按 key 顺序排列。把一层里的文件首尾相接，就是一个完整的有序序列，所以每一层整体是一个 sorted run（第 4 章定义过这个词）。</li>
<li>每一层有一个<b>目标大小</b>。L1 的目标由参数 <code>max_bytes_for_level_base</code> 指定（默认 256MB），之后每层是上一层的 <code>max_bytes_for_level_multiplier</code> 倍（默认 10 倍）：L2 是 2.56GB，L3 是 25.6GB……</li>
<li>一次 compaction 的动作是：从某一层 Ln 取出一些文件，再取出 Ln+1 中 key 范围与它们重叠的所有文件，把这些文件归并成新文件放进 Ln+1，然后删除参与合并的旧文件。因为把 Ln+1 中重叠的文件都带上了，合并后 Ln+1 仍然不重叠。</li>
</ul>
<h2>为什么每层是上一层的 10 倍</h2>
<p>这个倍数决定了两件事之间的取舍。</p>
<p><b>倍数大，层数就少。</b>数据从 L0 走到最底层经过的层数少，查找要检查的层也少。</p>
<p><b>倍数大，每下一层的代价就高。</b>从 Ln 推一个文件到 Ln+1 时，Ln+1 中与它重叠的文件都要重写。Ln+1 的数据量是 Ln 的 10 倍，而两层覆盖的 key 范围差不多，所以 Ln 的一个文件平均对应 Ln+1 的大约 10 个文件。也就是为了推下去 1 份数据，要顺带重写约 10 份。</p>
<p>倍数小则相反：每次重写得少，但层数多。10 是一个经验上比较均衡的值。第 9 章有实验比较不同的倍数。</p>
<p>分层还带来一个关于空间的性质：最底层的大小是它上面所有层之和的大约 9 倍，也就是约 90% 的数据在最底层。上面各层里的数据是"还没来得及合并下去的较新版本"，即使它们全部是对最底层已有 key 的覆盖，多占的空间也只有约 10%。</p>

<h2>每次调度要回答的三个问题</h2>
<ol><li><b>哪一层？</b>给每层算一个分数（score），选分数最高且 ≥ 1 的层。</li><li><b>这一层的哪些文件？</b>L0 取所有互相重叠的文件；其他层按 <code>compaction_pri</code> 选一个文件，再做扩展。</li><li><b>下一层的哪些文件？</b>所有与已选文件 key 范围重叠的文件。</li></ol>
<h3>score 是什么</h3>
<p>score 表示"这一层超出允许量多少"：实际量 ÷ 允许量。小于 1 表示还没满；等于 2 表示已经是允许量的两倍。score 最高的层最需要处理。</p>

<p class="lead">Leveled 用较高的写放大换取低的读放大和空间放大。Universal 反过来：减少重写次数，容忍更多的 sorted run 和更多的临时空间。FIFO 完全不合并，只按总大小淘汰最老的数据。</p>
<h2>Universal 的模型</h2>
<p>先说动机。Leveled 每把数据下推一层，都要重写下一层中重叠的部分，同一份数据在到达底层之前被重写很多次。如果写入量很大、磁盘写入能力是瓶颈，这个代价就太高。Universal 的思路是：不强求每层内部整齐，只在"有序的数据段太多"或"浪费的空间太多"时才合并，并且尽量合并大小相近的段，这样每份数据被重写的次数少。</p>
<p>Universal 把数据看成一列按新旧排序的 <b>sorted run</b>（一组内部有序的数据，第 4 章定义过）：每个 L0 文件是一个 run，L1 及以下每个非空层是一个 run。compaction 总是合并<b>相邻</b>的若干个 run，结果放回原来的位置，所以 run 之间的新旧顺序不变。</p>
<p>当 run 的个数达到 <code>level0_file_num_compaction_trigger</code> 时开始检查，按以下顺序，第一个满足的生效：</p>

<li><b>size ratio。</b>从最新的 run 开始累计：只要"已累计大小 × (100 + size_ratio)% ≥ 下一个 run 的大小"，就把下一个 run 并入。累计到至少 <code>min_merge_width</code> 个就合并它们。效果是大小相近的 run 被合并，产生一个更大的 run。</li>
<li><b>run 个数。</b>前两条都不满足但 run 仍然太多时，忽略大小比例，强制合并最新的几个，使个数回到阈值以内。</li>
</ol>
<h2>实验：观察三种触发条件</h2>`);
